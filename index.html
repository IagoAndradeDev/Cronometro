<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="title">
                <h1>Timer</h1>
            </div>

                <p>0</p>
            </div>

                <button class="pause">Pause</button>
            </div>
        </div>
    </main>
<script src="script.js"></script>
</body>
</html>
